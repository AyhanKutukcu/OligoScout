# Add these blocks inside the existing HTTPS server { } for oligoscout.org
# (after certbot has added the 443 listener).

# MCP Streamable HTTP endpoint, health check and OpenAPI document
location = /mcp {
    proxy_pass http://127.0.0.1:8766/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;              # streamed responses
    proxy_read_timeout 300s;          # long design jobs
    client_max_body_size 4m;            # virtual PCR accepts pasted FASTA templates
}

location /mcp/ {
    proxy_pass http://127.0.0.1:8766/mcp/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
}

# REST tool calls (/mcp/api/tools/<name>) and /mcp/openapi.json are served through the
# /mcp/ block above; set OLIGOSCOUT_PUBLIC_URL=https://oligoscout.org/mcp in the service.

# OAuth 2.1 discovery for ChatGPT / claude.ai connectors (OLIGOSCOUT_OAUTH=1).
# Authorization, token and registration endpoints live under /mcp/oauth/ and
# are already covered by the /mcp/ block above.
location ^~ /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
