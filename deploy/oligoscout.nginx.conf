# OligoScout — nginx reverse proxy (public deployment)
# Install:  sudo cp deploy/oligoscout.nginx.conf /etc/nginx/sites-available/oligoscout
#           sudo ln -s /etc/nginx/sites-available/oligoscout /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see deploy/DEPLOY.md) to add HTTPS automatically.

server {
    listen 80;
    listen [::]:80;
    server_name oligoscout.org www.oligoscout.org;

    # The JSON API caps request bodies at ~64 KB; keep uploads small.
    client_max_body_size 128k;

    # Compress the ~4 MB single-file app and JSON responses.
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # IMPORTANT: preserve the public Host so the app's host/origin check passes.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analyses (genome-wide specificity scan) can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
