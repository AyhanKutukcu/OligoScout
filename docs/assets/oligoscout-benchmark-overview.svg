<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">OligoScout Test 81 benchmark overview</title>
  <desc id="desc">Key accuracy counts, search wall times and agreement with an independent full-reference oracle for OligoScout, Bowtie 1, BWA-aln and BLASTN-short.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="oligo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="608" rx="24" fill="url(#panel)" stroke="#cbd5e1" stroke-width="2"/>

  <text x="42" y="48" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">Test #81 · publication benchmark</text>
  <text x="42" y="76" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">GRCh38.p14 · 1,024 primer pairs · exact 12-nt 3′ anchor · ≤3 mismatches / primer · 50–3,000 bp products</text>
  <rect x="1010" y="28" width="145" height="34" rx="17" fill="#dcfce7" stroke="#86efac"/>
  <circle cx="1032" cy="45" r="8" fill="#16a34a"/>
  <path d="M1028 45l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1090" y="50" text-anchor="middle" fill="#166534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">FULL COMPLETE</text>

  <!-- KPI cards -->
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(42 105)">
      <rect width="266" height="100" rx="16" fill="#fff" stroke="#bae6fd"/>
      <circle cx="36" cy="34" r="17" fill="#e0f2fe"/>
      <text x="36" y="40" text-anchor="middle" fill="#0369a1" font-size="17" font-weight="700">P</text>
      <text x="62" y="39" fill="#0f172a" font-size="25" font-weight="750">1,024</text>
      <text x="22" y="76" fill="#64748b" font-size="13">balanced primer pairs</text>
    </g>
    <g transform="translate(325 105)">
      <rect width="266" height="100" rx="16" fill="#fff" stroke="#a7f3d0"/>
      <circle cx="36" cy="34" r="17" fill="#ccfbf1"/>
      <text x="36" y="40" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="700">B</text>
      <text x="62" y="39" fill="#0f172a" font-size="25" font-weight="750">8,262,803</text>
      <text x="22" y="76" fill="#64748b" font-size="13">oracle binding sites</text>
    </g>
    <g transform="translate(608 105)">
      <rect width="266" height="100" rx="16" fill="#fff" stroke="#ddd6fe"/>
      <circle cx="36" cy="34" r="17" fill="#ede9fe"/>
      <text x="36" y="40" text-anchor="middle" fill="#6d28d9" font-size="16" font-weight="700">A</text>
      <text x="62" y="39" fill="#0f172a" font-size="25" font-weight="750">425,055</text>
      <text x="22" y="76" fill="#64748b" font-size="13">oracle PCR products</text>
    </g>
    <g transform="translate(891 105)">
      <rect width="266" height="100" rx="16" fill="#fff" stroke="#fde68a"/>
      <circle cx="36" cy="34" r="17" fill="#fef3c7"/>
      <path d="M28 34l6 6 11-13" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="39" fill="#0f172a" font-size="25" font-weight="750">78 / 78</text>
      <text x="22" y="76" fill="#64748b" font-size="13">Release regression tests</text>
    </g>
  </g>

  <!-- Runtime panel -->
  <g transform="translate(42 232)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="715" height="318" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="24" y="38" fill="#0f172a" font-size="18" font-weight="750">Measured search wall time</text>
    <text x="24" y="61" fill="#64748b" font-size="12">seconds · single-thread · log-scaled bar length</text>

    <g transform="translate(24 88)" font-size="13">
      <text x="0" y="22" fill="#334155" font-weight="700">OligoScout</text>
      <rect x="145" y="4" width="346" height="28" rx="8" fill="#cffafe"/>
      <rect x="145" y="4" width="346" height="28" rx="8" fill="url(#oligo)"/>
      <text x="503" y="23" fill="#0e7490" font-weight="750">111.80 s</text>

      <text x="0" y="77" fill="#334155">BWA-aln</text>
      <rect x="145" y="59" width="363" height="28" rx="8" fill="#ede9fe"/>
      <rect x="145" y="59" width="363" height="28" rx="8" fill="#8b5cf6"/>
      <text x="520" y="78" fill="#6d28d9" font-weight="700">141.14 s</text>

      <text x="0" y="132" fill="#334155">Bowtie 1</text>
      <rect x="145" y="114" width="368" height="28" rx="8" fill="#dbeafe"/>
      <rect x="145" y="114" width="368" height="28" rx="8" fill="#3b82f6"/>
      <text x="525" y="133" fill="#1d4ed8" font-weight="700">148.64 s</text>

      <text x="0" y="187" fill="#334155">BLASTN-short</text>
      <rect x="145" y="169" width="510" height="28" rx="8" fill="#e2e8f0"/>
      <rect x="145" y="169" width="510" height="28" rx="8" fill="#475569"/>
      <text x="645" y="188" text-anchor="end" fill="#fff" font-weight="700">3,065.39 s</text>
    </g>

    <line x1="169" y1="305" x2="679" y2="305" stroke="#cbd5e1"/>
    <text x="169" y="299" fill="#94a3b8" font-size="10">shorter</text>
    <text x="679" y="299" text-anchor="end" fill="#94a3b8" font-size="10">longer</text>
  </g>

  <!-- Correctness panel -->
  <g transform="translate(780 232)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="377" height="318" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="750">Product-set agreement</text>
    <text x="24" y="61" fill="#94a3b8" font-size="12">F1 against independent full-scan oracle</text>

    <g transform="translate(24 88)">
      <rect width="329" height="42" rx="10" fill="#123348"/>
      <text x="14" y="27" fill="#e0f2fe" font-size="13" font-weight="700">OligoScout</text>
      <text x="311" y="27" text-anchor="end" fill="#67e8f9" font-size="14" font-weight="750">1.000000</text>

      <rect y="53" width="329" height="42" rx="10" fill="#282052"/>
      <text x="14" y="80" fill="#ede9fe" font-size="13">BWA-aln + filter</text>
      <text x="311" y="80" text-anchor="end" fill="#c4b5fd" font-size="14" font-weight="700">1.000000</text>

      <rect y="106" width="329" height="42" rx="10" fill="#172b4f"/>
      <text x="14" y="133" fill="#dbeafe" font-size="13">Bowtie 1 + filter</text>
      <text x="311" y="133" text-anchor="end" fill="#93c5fd" font-size="14" font-weight="700">1.000000</text>

      <rect y="159" width="329" height="42" rx="10" fill="#293445"/>
      <text x="14" y="186" fill="#e2e8f0" font-size="13">BLASTN-short + filter</text>
      <text x="311" y="186" text-anchor="end" fill="#cbd5e1" font-size="14" font-weight="700">0.999998</text>
    </g>

    <text x="24" y="303" fill="#86efac" font-size="12" font-weight="700">All methods: 1,024 / 1,024 intended products</text>
  </g>

  <text x="42" y="584" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Observed on one WSL2/DrvFS system with prebuilt indexes. Accuracy is oracle-revalidated; timing is configuration-specific.</text>
</svg>
