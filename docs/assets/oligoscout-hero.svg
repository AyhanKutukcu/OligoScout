<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OligoScout</title>
  <desc id="desc">A scientific banner with a DNA helix, indexed genomic blocks and an anchor-aware search lens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.52" stop-color="#0b2540"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-width="0.7" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="360" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1018" cy="45" r="210" fill="#7c3aed" opacity="0.07"/>
    <circle cx="157" cy="325" r="190" fill="#06b6d4" opacity="0.07"/>

    <!-- DNA helix -->
    <g transform="translate(48 40)" fill="none" stroke-linecap="round">
      <path d="M30 8 C165 42 20 104 155 138 C290 172 145 234 280 268" stroke="#22d3ee" stroke-width="7" opacity="0.95" filter="url(#glow)"/>
      <path d="M155 8 C20 42 165 104 30 138 C-105 172 40 234 -95 268" transform="translate(125 0)" stroke="#a78bfa" stroke-width="7" opacity="0.9" filter="url(#glow)"/>
      <g stroke-width="3" opacity="0.78">
        <path d="M59 21L251 21" stroke="#e0f2fe"/>
        <path d="M93 54L218 54" stroke="#67e8f9"/>
        <path d="M86 88L225 88" stroke="#c4b5fd"/>
        <path d="M46 121L264 121" stroke="#e0f2fe"/>
        <path d="M46 155L264 155" stroke="#67e8f9"/>
        <path d="M86 189L225 189" stroke="#c4b5fd"/>
        <path d="M93 222L218 222" stroke="#e0f2fe"/>
        <path d="M59 255L251 255" stroke="#67e8f9"/>
      </g>
      <g fill="#f8fafc">
        <circle cx="59" cy="21" r="5"/><circle cx="251" cy="21" r="5"/>
        <circle cx="93" cy="54" r="5"/><circle cx="218" cy="54" r="5"/>
        <circle cx="86" cy="88" r="5"/><circle cx="225" cy="88" r="5"/>
        <circle cx="46" cy="121" r="5"/><circle cx="264" cy="121" r="5"/>
        <circle cx="46" cy="155" r="5"/><circle cx="264" cy="155" r="5"/>
        <circle cx="86" cy="189" r="5"/><circle cx="225" cy="189" r="5"/>
        <circle cx="93" cy="222" r="5"/><circle cx="218" cy="222" r="5"/>
        <circle cx="59" cy="255" r="5"/><circle cx="251" cy="255" r="5"/>
      </g>
    </g>

    <!-- Main title -->
    <g transform="translate(390 75)">
      <text x="0" y="44" fill="#e0f2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="750" letter-spacing="-2">Oligo<tspan fill="#67e8f9">Scout</tspan></text>
      <rect x="1" y="64" width="490" height="4" rx="2" fill="url(#accent)"/>
      <text x="1" y="103" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="0.5">ANCHOR-AWARE SHORT DNA SEARCH</text>
      <text x="1" y="137" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Persistent bidirectional FM-indexes · PCR product intelligence</text>

      <g transform="translate(0 178)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
        <rect x="0" y="0" width="172" height="34" rx="17" fill="#082f49" stroke="#0ea5e9"/>
        <text x="86" y="22" text-anchor="middle" fill="#7dd3fc">BIDIRECTIONAL FM</text>
        <rect x="184" y="0" width="152" height="34" rx="17" fill="#134e4a" stroke="#14b8a6"/>
        <text x="260" y="22" text-anchor="middle" fill="#5eead4">EXACT 3′ ANCHOR</text>
        <rect x="348" y="0" width="152" height="34" rx="17" fill="#3b1d69" stroke="#8b5cf6"/>
        <text x="424" y="22" text-anchor="middle" fill="#c4b5fd">GRCh38 VALIDATED</text>
      </g>
    </g>

    <!-- Search lens and indexed genomic blocks -->
    <g transform="translate(925 65)">
      <g opacity="0.72">
        <rect x="-38" y="4" width="70" height="16" rx="8" fill="#0e7490"/>
        <rect x="-62" y="32" width="94" height="16" rx="8" fill="#2563eb"/>
        <rect x="-22" y="60" width="54" height="16" rx="8" fill="#7c3aed"/>
        <rect x="-76" y="88" width="108" height="16" rx="8" fill="#0f766e"/>
        <rect x="-48" y="116" width="80" height="16" rx="8" fill="#4338ca"/>
        <g fill="#dbeafe" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9">
          <text x="-29" y="15">ACGT...TGCA</text>
          <text x="-53" y="43">GCTA...ACGT...TT</text>
          <text x="-13" y="71">TACG...A</text>
          <text x="-67" y="99">CGAT...ACGT...TGA</text>
          <text x="-39" y="127">TGCA...CGAT</text>
        </g>
      </g>
      <circle cx="42" cy="78" r="92" fill="url(#lens)" stroke="#67e8f9" stroke-width="7" filter="url(#glow)"/>
      <circle cx="42" cy="78" r="72" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 7" opacity="0.9"/>
      <path d="M108 145L173 210" stroke="#67e8f9" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M108 145L173 210" stroke="#e0f2fe" stroke-width="7" stroke-linecap="round"/>
      <rect x="-28" y="69" width="140" height="20" rx="10" fill="#06b6d4" opacity="0.85"/>
      <text x="42" y="83" text-anchor="middle" fill="#ecfeff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">3′ ANCHOR MATCH</text>
    </g>

    <g fill="#e0f2fe" opacity="0.45">
      <circle cx="360" cy="45" r="2"/><circle cx="710" cy="44" r="2"/><circle cx="820" cy="309" r="2"/>
      <circle cx="1135" cy="286" r="2"/><circle cx="642" cy="326" r="2"/><circle cx="340" cy="318" r="2"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
</svg>
