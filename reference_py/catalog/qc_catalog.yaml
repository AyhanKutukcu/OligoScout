# OligoScout QC katalogu — TEK DOGRULUK KAYNAGI.
# Uretilen dosyalar: python3 reference_py/cli/catalog_yaml.py export
schema: oligoscout-qc-catalog/1
rules:
- id: AMP-01
  family: Amplikon
  status: etiketli_uygulandi
  spec_title: amplikon / Amplikon GC / %GC ve 50-nt kayan pencere maksimumu
  where: reference_py/oligoscout_thermo/seqpair.py; reference_py/cli/sequence_qc.py
  evidence_level: regression
  evidence:
    regression:
    - seqpair/seqpair_qc.tsv
    - seqpair/seqpair_qc_records.jsonl
    archive:
    - _bis_test/seqpair_qc.tsv
    - _bis_test/seqpair_qc_records.jsonl
    - _newqc_test/seqpair_qc.tsv
    - _newqc_test/seqpair_qc_records.jsonl
    - design_ctdna/seqpair_qc.tsv
    - design_ctdna/seqpair_qc_records.jsonl
    - seqpair/seqpair_qc.tsv
    - seqpair/seqpair_qc_records.jsonl
    unit_test:
    - reference_py/tests/test_seqpair.py:102
    code:
    - reference_py/oligoscout_thermo/seqpair.py:16
    - web/src/core.js:247
    - web/src/views2.js:73
  calibration:
    status: uncalibrated
    record: REP-03
    note: esikler literatur baslangic degerleri; islak laboratuvar kalibrasyonu yok
  name:
    tr: Ürünün GC oranı
    en: Product GC content
  check:
    tr: Ürünün tamamında ve kısa pencerelerde G ve C oranını ölçer.
    en: Measures the fraction of G and C across the product and in short windows.
  why:
    tr: GC bakımından yoğun bir bölge, ortalama normal görünse bile ürünün ayrılmasını zorlaştırabilir.
    en: A GC-rich stretch can make the product harder to denature even when the average looks normal.
- id: AMP-02
  family: Amplikon
  status: etiketli_uygulandi
  spec_title: amplikon / Erime profili (tahmini) / Kendi Poland tipi istatistiksel mekanik erime algoritması; dθ/dT
    pik sayı
  where: reference_py/cli/amplicon_melt.py (QPCR-02 ile ayni hesap)
  evidence_level: regression
  evidence:
    regression:
    - melt/amplicon_melt.tsv [amp02]
    archive: []
    unit_test: []
    code:
    - reference_py/cli/amplicon_melt.py:110
    - web/src/core.js:207
  calibration:
    status: uncalibrated
    record: REP-03
    note: esikler literatur baslangic degerleri; islak laboratuvar kalibrasyonu yok
  name:
    tr: Ürünün erime profili
    en: Product melting profile
  check:
    tr: Ürünün ısınırken hangi sıcaklıklarda ayrılacağını tahmin eder.
    en: Predicts the temperatures at which the product separates as it heats.
  why:
    tr: Tek ürünün farklı bölgeleri ayrı eriyebilir; bu, birden çok piki yorumlamaya yardım eder.
    en: Regions of a single product may melt separately, which helps explain multiple peaks.
- id: AMP-03
  family: Amplikon
  status: etiketli_uygulandi
  spec_title: amplikon / Tekrar / düşük karmaşıklık / CMP-05 ve CMP-06 amplikona
  where: reference_py/oligoscout_thermo/seqpair.py; reference_py/cli/sequence_qc.py
