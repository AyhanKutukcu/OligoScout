  name:
    tr: Dönüşmüş kalıbı ayırt etme
    en: Discrimination of converted template
  check:
    tr: Dönüşüm öncesi bağlanma bölgesindeki CpG dışı sitozinleri sayar.
    en: Counts non-CpG cytosines in the binding region before conversion.
  why:
    tr: Bu konumlar, primerin dönüşmüş kalıbı dönüşmemiş kalıptan ayırt etmesine yardımcı olabilir.
    en: These positions can help distinguish converted from unconverted templates.
- id: BIS-03
