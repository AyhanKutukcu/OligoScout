    record: REP-03
    note: esikler literatur baslangic degerleri; islak laboratuvar kalibrasyonu yok
  name:
    tr: Ürün içinde boy değiştiren varyantlar
    en: Length-changing variants inside the product
  check:
    tr: Primer bölgelerinin dışında ve ürünün içinde kalan yaygın ekleme ve silmeleri inceler.
    en: Checks common insertions and deletions inside the product but outside the primer sites.
  why:
    tr: Ürün boyu değişirse boy farkına dayanan bir okuma yanlış yorumlanabilir.
    en: A change in product length can mislead a readout that relies on size.
