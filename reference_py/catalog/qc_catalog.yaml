  name:
    tr: Dönüşüm sonrası dizi çeşitliliği
    en: Sequence diversity after conversion
  check:
    tr: Dönüşmüş primer dizisinin baz çeşitliliğini inceler.
    en: Assesses base diversity in the converted primer sequence.
  why:
    tr: Dönüşümden sonra diziler daha benzer hale gelirse tek bir hedefi ayırt etmek zorlaşabilir.
    en: If conversion makes sequences more alike, it can be harder to distinguish a single target.
