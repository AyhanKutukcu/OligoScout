    - design_ctdna/seqpair_qc_records.jsonl
    - seqpair/seqpair_qc.tsv
    - seqpair/seqpair_qc_records.jsonl
    unit_test: []
    code:
    - reference_py/oligoscout_thermo/seqpair.py:17
    - web/src/core.js:248
  calibration:
    status: uncalibrated
    record: REP-03
    note: esikler literatur baslangic degerleri; islak laboratuvar kalibrasyonu yok
  name:
    tr: Üründe tekrarlar
    en: Repeats in the product
  check:
    tr: Üründe tekrarları, düşük baz çeşitliliğini ve G-dörtlüsü adaylarını arar.
    en: Looks for repeats, low base diversity, and candidate G-quadruplex motifs.
  why:
    tr: Bu bölgeler ürünün çoğaltılmasını veya okunmasını zorlaştırabilir.
    en: These regions can complicate amplification or sequencing.
- id: BIS-01
  family: Bisulfit
  status: etiketli_uygulandi
  spec_title: primer / CpG içeriği / Primerde CpG sayısı ve 3′'e uzaklığı (MSP hariç)
  where: reference_py\oligoscout_thermo\bisulfite.py:check_bis01; cli\sequence_qc.py (--profile bisulfite, --msp)
  evidence_level: unit_test
  evidence:
    regression: []
    archive:
    - _bis_test/seqpair_qc.tsv
    - _bis_test/seqpair_qc_records.jsonl
    unit_test:
    - reference_py/tests/test_bisulfite.py:1
    code:
    - reference_py/cli/sequence_qc.py:84
    - reference_py/oligoscout_thermo/bisulfite.py:1
    - reference_py/oligoscout_thermo/profiles.py:168
    - web/local_engine.py:543
  calibration:
    status: uncalibrated
    record: REP-03
    note: esikler literatur baslangic degerleri; islak laboratuvar kalibrasyonu yok
  name:
    tr: Primerde CpG konumu
    en: CpG positions in the primer
  check:
    tr: CpG konumlarını sayar ve 3′ uca uzaklıklarını inceler.
    en: Counts CpG positions and measures how close they are to the 3′ end.
  why:
    tr: Metilasyon durumuyla değişen bazlar, metilasyondan bağımsız ölçümlerde sonucu yanlılaştırabilir.
    en: Bases that vary with methylation can bias assays meant to be independent of methylation.
