    tr: Dönüşmüş ipliklere özgüllük
    en: Specificity to converted strands
  check:
    tr: Uygun indeksler verildiğinde dönüşmüş ipliklerdeki olası ürünleri karşılaştırır.
    en: Compares possible products across converted strands when indexes are available.
  why:
    tr: İstenmeyen iplikte oluşan ürünler metilasyon ölçümünü karıştırabilir.
    en: Products from unintended strands can confound a methylation measurement.
